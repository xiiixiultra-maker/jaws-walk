<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "What is cosmetic foot surgery?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Cosmetic foot surgery refers to procedures focused on refining the shape, proportion and appearance of the foot and toes, such as toe shortening, lengthening, straightening and foot slimming, in addition to improving comfort in footwear."
      }
    },
    {
      "@type": "Question",
      "name": "Is surgery done under local anesthesia?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Appropriate procedures may be performed under local anesthesia, in our in-office surgical suite. Your anesthesia plan depends on your procedure and your individual needs."
      }
    },
    {
      "@type": "Question",
      "name": "How long is recovery?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Recovery varies by procedure and by patient. Dr. Wagner reviews expected recovery in detail during your personalized evaluation and treatment plan."
      }
    },
    {
      "@type": "Question",
      "name": "Can I walk after surgery?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Some patients may be permitted to walk with protective footwear following treatment, while other procedures may require greater restrictions. Dr. Wagner will give you instructions specific to your treatment."
      }
    },
    {
      "@type": "Question",
      "name": "Can both feet be done at the same time?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "For selected patients, yes. Dr. Wagner decides whether it's right for you based on your procedure and your case."
      }
    },
    {
      "@type": "Question",
      "name": "I live out of state. Can I still come to JAWS?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Patients travel to JAWS Podiatry from across the United States and beyond, and a virtual consultation lets you start from home."
      }
    },
    {
      "@type": "Question",
      "name": "How do I book a consultation?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Request a consultation online or call (954) 922-7333, and our team will follow up to find a time that works for you."
      }
    }
  ]
}
</script>
